[project]
name = "stock-checker"
version = "0.1.0"
description = "Stock checker with news sentiment analysis and portfolio tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "newsapi-python>=0.2.7",
    "openai>=1.55.0",
    "yfinance>=0.2.48",
    "pandas>=2.2.0",
    "python-multipart>=0.0.12",
    "cachetools>=5.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
